# NAFNet-width32 for Image Deraining
# Train on Rain13K, validate on Rain100H

name: NAFNet-Derain-width32
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 42

datasets:
  train:
    name: Rain13K-train
    type: PairedImageDataset
    dataroot_gt: /home/user/noob/deraining/datasets/Rain13K/train/target
    dataroot_lq: /home/user/noob/deraining/datasets/Rain13K/train/input
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_flip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: Rain100H-val
    type: PairedImageDataset
    dataroot_gt: /home/user/noob/deraining/datasets/Rain13K/test/Rain100H/target
    dataroot_lq: /home/user/noob/deraining/datasets/Rain13K/test/Rain100H/input
    io_backend:
      type: disk

network_g:
  type: NAFNet
  width: 32
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: experiments/NAFNet-Derain-width32/training_states/170000.state

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-3
    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 300000
    eta_min: !!float 1e-7

  total_iter: 300000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true

logger:
  print_freq: 500
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 29500
